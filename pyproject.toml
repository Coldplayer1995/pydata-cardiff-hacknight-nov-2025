[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["daveparr"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.yaml", "*.md"]

[project]
name = "pydata-cardiff-hacknight-nov-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "narwhals>=2.11.0",
    "neo4j>=5.15.0",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "pydytuesday>=0.1.2",
    "pytest>=9.0.0",
]

[project.scripts]
setup = "setup_project:main"
